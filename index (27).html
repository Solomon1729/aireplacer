<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Magic Replace</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1c;--bd:#c9c9c4;--ac:#1f5fd6;--pn:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--fg:#e8e8e4;--bd:#454545;--ac:#6b9cff;--pn:#242424}}
*{box-sizing:border-box}
body{margin:0;padding:14px;font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg)}
h1{font-size:17px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-bottom:8px}
label{display:inline-flex;gap:5px;align-items:center}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 7px}
input[type=range]{padding:0}
input[type=number]{width:64px}
#prompt{width:min(320px,100%)}
button{cursor:pointer}
button.go{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;padding:5px 16px}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button:disabled{opacity:.5;cursor:wait}
#wrap{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:6px;background:repeating-conic-gradient(#8883 0 25%,#0000 0 50%) 0 0/16px 16px}
canvas{display:block;max-width:100%;height:auto;touch-action:none;cursor:crosshair}
#st{margin:8px 0;min-height:1.5em;white-space:pre-wrap}
#cands{display:flex;flex-wrap:wrap;gap:8px}
#cands canvas{width:150px;border:2px solid var(--bd);border-radius:4px;cursor:pointer}
#cands canvas.on{border-color:var(--ac)}
.hq{display:none}body.hqmode .hq{display:inline-flex}body.hqmode .lt{display:none}
small{opacity:.75}
</style>
</head>
<body>
<h1>Local Magic Replace <small>— 画像は端末の外に出ません</small></h1>
<div class="bar">
 <input type="file" id="file" accept="image/*" aria-label="画像を開く">
 <label>モード
  <select id="mode">
   <option value="lite">軽量版（ブラウザ内・削除特化）</option>
   <option value="hq">高品質版（ローカルサーバー・プロンプト対応）</option>
  </select></label>
 <label>ツール <select id="tool"><option value="brush">ブラシ</option><option value="lasso">投げ縄</option></select></label>
 <label>ブラシ <input type="range" id="bs" min="4" max="150" value="40"></label>
 <label><input type="checkbox" id="er">消しゴム</label>
 <button id="clr">マスク消去</button>
</div>
<div class="bar">
 <label class="hq">プロンプト <input id="prompt" placeholder="例: a horse standing in a field"></label>
 <label class="hq">ステップ <input type="number" id="steps" value="50" min="1" max="150"></label>
 <label class="hq">サーバー <input id="srv" value="http://localhost:8000" size="22"></label>
 <label class="lt">モデルURL <input id="murl" size="34" value="https://huggingface.co/simonw/Moebius-ONNX/resolve/main/"></label>
 <label>候補数 <input type="number" id="n" value="4" min="1" max="16"></label>
 <label>seed <input type="number" id="seed" placeholder="自動"></label>
 <label>許容時間(時間) <input type="number" id="lim" value="5" min="0.1" step="0.5"></label>
 <button class="go" id="go" disabled>生成</button>
</div>
<div id="wrap"><canvas id="cv" width="640" height="360" tabindex="0" aria-label="マスクを塗るキャンバス"></canvas></div>
<div id="st">画像を開いて、置き換えたい部分を塗ってください。</div>
<div class="bar" id="after" style="display:none">
 <span>候補をクリックで差し替え:</span><button id="ok">確定（次の編集へ）</button><button id="dl">PNG保存</button>
</div>
<div id="cands"></div>

<script type="module">
const $=s=>document.querySelector(s);
const ORT='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
const SF=0.13025,NOFF=0.0357,GS=2.0,L=4096;

const cv=$('#cv'),cx=cv.getContext('2d');
const mk=document.createElement('canvas'),mx=mk.getContext('2d',{willReadFrequently:true});
const bs=document.createElement('canvas'),bx=bs.getContext('2d');   // 現在の画像
const sn=document.createElement('canvas'),sx_=sn.getContext('2d');  // 実行前の画像
let W=0,H=0,show=true,busy=false,cands=[],ort=null,S=null,tsType='int64';
const st=m=>$('#st').textContent=m;
const fmt=ms=>{const s=ms/1e3;return s<90?s.toFixed(0)+'秒':s<5400?(s/60).toFixed(1)+'分':(s/3600).toFixed(1)+'時間'};
$('#murl').onchange=()=>{S=null};  // モデルURLを変えたら読み直す
$('#mode').onchange=e=>document.body.classList.toggle('hqmode',e.target.value==='hq');

function draw(){cx.clearRect(0,0,W,H);cx.drawImage(bs,0,0);if(show){cx.globalAlpha=.5;cx.drawImage(mk,0,0);cx.globalAlpha=1}}

$('#file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const b=await createImageBitmap(f);W=cv.width=mk.width=bs.width=sn.width=b.width;H=cv.height=mk.height=bs.height=sn.height=b.height;
 bx.drawImage(b,0,0);mx.clearRect(0,0,W,H);show=true;draw();$('#go').disabled=false;$('#cands').innerHTML='';$('#after').style.display='none';
 st(`${W}×${H}px。置き換えたい部分を塗ってください。`);
};

let last=null;
const pt=e=>{const r=cv.getBoundingClientRect(),k=W/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k}};
function stroke(a,b){
 show=true;mx.globalCompositeOperation=$('#er').checked?'destination-out':'source-over';
 mx.strokeStyle='#f22';mx.lineWidth=+$('#bs').value*W/cv.clientWidth;mx.lineCap=mx.lineJoin='round';
 mx.beginPath();mx.moveTo(a.x,a.y);mx.lineTo(b.x,b.y);mx.stroke();draw();
}
let lp=null;  // 投げ縄の軌跡
const path=(c,a)=>{c.beginPath();a.forEach((q,i)=>i?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.closePath()};
cv.onpointerdown=e=>{
 if(!W)return;cv.setPointerCapture(e.pointerId);const p=pt(e);
 if($('#tool').value==='lasso'){lp=[p];return}
 last=p;stroke(p,p);
};
cv.onpointermove=e=>{
 const p=pt(e);
 if(lp){lp.push(p);draw();cx.save();cx.setLineDash([8,6]);cx.lineWidth=2*W/cv.clientWidth;cx.strokeStyle='#fff';path(cx,lp);cx.stroke();cx.restore();return}
 if(last){stroke(last,p);last=p}
};
cv.onpointerup=cv.onpointercancel=()=>{
 if(lp&&lp.length>2){mx.globalCompositeOperation=$('#er').checked?'destination-out':'source-over';mx.fillStyle='#f22';path(mx,lp);mx.fill();show=true}
 lp=null;last=null;draw();
};
$('#clr').onclick=()=>{mx.clearRect(0,0,W,H);show=true;draw()};

// ---- 選択範囲 → 正方形の切り出し領域（文脈用の余白つき） ----
function cropRect(){
 const d=mx.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>127){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<0)throw Error('置き換える範囲を塗ってください。');
 const m=Math.max(x1-x0+1,y1-y0+1),lim=Math.min(W,H);
 if(m>lim)throw Error('選択範囲が大きすぎます。画像の短辺以下にしてください。');
 const s=Math.min(lim,Math.max(Math.ceil(m*1.6+32),Math.min(256,lim)));
 const cl=(v,hi)=>Math.max(0,Math.min(hi,v));
 return{s,sx:cl(Math.round((x0+x1)/2-s/2),W-s),sy:cl(Math.round((y0+y1)/2-s/2),H-s)};
}
function region(src,r,n){
 const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d',{willReadFrequently:true});
 x.imageSmoothingQuality='high';x.drawImage(src,r.sx,r.sy,r.s,r.s,0,0,n,n);return c;
}
const blob=c=>new Promise(r=>c.toBlob(r,'image/png'));

// ---- 軽量版: Moebius (ONNX Runtime Web / WebGPU) ----
async function bytes(name){
 const c=await caches.open('models'),u=$('#murl').value.replace(/\/?$/,'/')+name,hit=await c.match(u);
 if(hit)return new Uint8Array(await hit.arrayBuffer());
 const r=await fetch(u);if(!r.ok)throw Error('モデルのDLに失敗: '+name);
 const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
 for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;st(`DL中 ${name}: ${(got/1e6)|0}/${(tot/1e6)|0} MB（初回のみ）`)}
 const b=new Uint8Array(got);let o=0;for(const v of ch){b.set(v,o);o+=v.length}
 await c.put(u,new Response(b));return b;
}
async function liteLoad(){
 if(S)return S;if(!navigator.gpu)throw Error('WebGPU非対応です（Chromeを更新してください）。');
 ort=await import(ORT+'ort.webgpu.min.mjs');ort.env.wasm.wasmPaths=ORT;ort.env.wasm.numThreads=1;
 navigator.storage?.persist?.();S={};
 for(const[k,f]of[['enc','vae_encoder'],['unet','unet'],['dec','vae_decoder']]){
  const b=await bytes(f+'.onnx');st(`モデル初期化中: ${f}`);S[k]=await ort.InferenceSession.create(b,{executionProviders:['webgpu']});
 }
 return S;
}
const IDS=BigInt64Array.from([...Array(10)].map((_,i)=>BigInt(10+i)).concat([...Array(10)].map((_,i)=>BigInt(i)))); // 前半=無条件, 後半=条件
async function unetRun(nine,t){
 const mkT=()=>tsType==='int64'?new ort.Tensor('int64',BigInt64Array.from([BigInt(t),BigInt(t)]),[2]):new ort.Tensor('float32',Float32Array.of(t,t),[2]);
 try{
  const o=await S.unet.run({latent:new ort.Tensor('float32',nine,[2,9,64,64]),timesteps:mkT(),input_ids:new ort.Tensor('int64',IDS,[2,10])});
  return o.noise.data;
 }catch(e){if(tsType==='int64'){tsType='float32';return unetRun(nine,t)}throw e}
}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function lite(r,seed,estN){
 await liteLoad();const P=512*512;
 const id=region(bs,r,512).getContext('2d').getImageData(0,0,512,512).data;
 const md=region(mk,r,512).getContext('2d').getImageData(0,0,512,512).data;
 const im=new Float32Array(3*P),m1=new Float32Array(P);
 for(let i=0;i<P;i++){const m=md[i*4+3]>127?1:0;m1[i]=m;for(let c=0;c<3;c++)im[c*P+i]=(id[i*4+c]/127.5-1)*(1-m)}
 const m64=new Float32Array(L);for(let y=0;y<64;y++)for(let x=0;x<64;x++)m64[y*64+x]=m1[(y*8+4)*512+x*8+4];
 const eo=await S.enc.run({[S.enc.inputNames[0]]:new ort.Tensor('float32',im,[1,3,512,512])});
 const mo=Object.values(eo)[0].data,ml=new Float32Array(4*L);for(let i=0;i<4*L;i++)ml[i]=mo[i]*SF;
 const R=rng(seed),gauss=()=>Math.sqrt(-2*Math.log(R()+1e-12))*Math.cos(6.283185307*R());
 const lat=new Float32Array(4*L);for(let i=0;i<4*L;i++)lat[i]=gauss();
 for(let c=0;c<4;c++){const o=NOFF*gauss();for(let j=0;j<L;j++)lat[c*L+j]+=o}
 const ac=new Float32Array(1000);let p=1;const a=Math.sqrt(.00085),b=Math.sqrt(.012);
 for(let i=0;i<1000;i++){const s=a+(b-a)*i/999;p*=1-s*s;ac[i]=p}
 const ts=[];for(let t=900;t>=0;t-=50)ts.push(t);
 for(let k=0;k<ts.length;k++){
  const t=ts[k],t0=performance.now(),nine=new Float32Array(18*L);
  for(let q=0;q<2;q++){const o=q*9*L;nine.set(lat,o);nine.set(m64,o+4*L);nine.set(ml,o+5*L)}
  const e=await unetRun(nine,t),acT=ac[t],acP=t>=50?ac[t-50]:1;
  for(let i=0;i<4*L;i++){
   const u=e[i],g=u+GS*(e[4*L+i]-u),x0=(lat[i]-Math.sqrt(1-acT)*g)/Math.sqrt(acT);
   lat[i]=Math.sqrt(acP)*x0+Math.sqrt(1-acP)*g;
  }
  const dt=performance.now()-t0;
  if(k===1&&estN)guard(dt*ts.length*estN,'軽量版');
  st(`軽量版 生成中 ${k+1}/${ts.length}（1ステップ ${fmt(dt)}）`);
 }
 for(let i=0;i<4*L;i++)lat[i]/=SF;
 const dec=Object.values(await S.dec.run({[S.dec.inputNames[0]]:new ort.Tensor('float32',lat,[1,4,64,64])}))[0].data;
 const out=document.createElement('canvas');out.width=out.height=512;const ox=out.getContext('2d'),od=ox.createImageData(512,512);
 for(let i=0;i<P;i++)for(let c=0;c<3;c++)od.data[i*4+c]=Math.max(0,Math.min(255,(dec[c*P+i]+1)*127.5));
 for(let i=0;i<P;i++)od.data[i*4+3]=255;
 ox.putImageData(od,0,0);return out;
}

// ---- 高品質版: ローカルのPythonサーバー(server.py)へ ----
async function hq(r,seed,estN){
 const ic=region(bs,r,1024),mc=region(mk,r,1024),mx2=mc.getContext('2d'),d=mx2.getImageData(0,0,1024,1024);
 for(let i=0;i<d.data.length;i+=4){const v=d.data[i+3]>127?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
 mx2.putImageData(d,0,0);
 const [ib,mb]=[await blob(ic),await blob(mc)],url=$('#srv').value.replace(/\/$/,'')+'/inpaint';
 const call=async steps=>{
  const f=new FormData();f.append('image',ib,'i.png');f.append('mask',mb,'m.png');
  f.append('prompt',$('#prompt').value);f.append('steps',steps);f.append('seed',seed);
  const res=await fetch(url,{method:'POST',body:f});if(!res.ok)throw Error('サーバーエラー: '+await res.text());
  return createImageBitmap(await res.blob());
 };
 const steps=+$('#steps').value;
 if(estN){st('所要時間を見積もり中（1ステップ試走）…');const t0=performance.now();await call(1);guard((performance.now()-t0)*steps*estN,'高品質版（上限寄りの見積もり）')}
 const t0=performance.now(),tick=setInterval(()=>st(`高品質版 生成中… 経過 ${fmt(performance.now()-t0)}（${steps}ステップ）`),1000);
 try{const bm=await call(steps);const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(bm,0,0);return c}
 finally{clearInterval(tick)}
}
function guard(totalMs,name){
 const lim=+$('#lim').value*3.6e6;
 if(totalMs>lim&&!confirm(`${name}: 全体で約${fmt(totalMs)}かかる見込みで、許容時間(${fmt(lim)})を超えます。続行しますか？`))throw Error('中止しました（見込み '+fmt(totalMs)+'）');
 st(`見込み 約${fmt(totalMs)}`);
}

// ---- 合成（境界をぼかして貼り戻す） ----
function paste(res,r){
 const s=r.s,t=document.createElement('canvas');t.width=t.height=s;const x=t.getContext('2d');
 x.imageSmoothingQuality='high';x.drawImage(res,0,0,s,s);
 const m=document.createElement('canvas');m.width=m.height=s;const y=m.getContext('2d');
 y.filter=`blur(${Math.max(2,s/200)}px)`;y.drawImage(mk,r.sx,r.sy,s,s,0,0,s,s);y.drawImage(m,0,0);
 x.globalCompositeOperation='destination-in';x.drawImage(m,0,0);bx.drawImage(t,r.sx,r.sy);
}
function apply(i){
 bx.clearRect(0,0,W,H);bx.drawImage(sn,0,0);paste(cands[i].res,cands[i].r);show=false;draw();
 document.querySelectorAll('#cands canvas').forEach((c,j)=>c.classList.toggle('on',j===i));
}
$('#ok').onclick=()=>{mx.clearRect(0,0,W,H);sx_.clearRect(0,0,W,H);sx_.drawImage(bs,0,0);show=true;draw();$('#cands').innerHTML='';$('#after').style.display='none';st('確定しました。')};
$('#dl').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(await blob(bs));a.download='edited.png';a.click()};

$('#go').onclick=async()=>{
 if(busy||!W)return;busy=true;$('#go').disabled=true;
 try{
  const r=cropRect(),n=Math.max(1,+$('#n').value||1),s0=+$('#seed').value||Math.floor(Math.random()*1e6),m=$('#mode').value;
  sx_.clearRect(0,0,W,H);sx_.drawImage(bs,0,0);cands=[];$('#cands').innerHTML='';
  const t0=performance.now();
  for(let i=0;i<n;i++){
   const res=m==='lite'?await lite(r,s0+i,i===0?n:0):await hq(r,s0+i,i===0?n:0);
   cands.push({res,r});const th=document.createElement('canvas');th.width=th.height=150;th.getContext('2d').drawImage(res,0,0,150,150);
   const k=cands.length-1;th.onclick=()=>apply(k);th.title='seed '+(s0+i);$('#cands').append(th);
   if(i===0){apply(0);$('#after').style.display='flex'}
  }
  st(`完了: ${n}候補 / ${fmt(performance.now()-t0)}。気に入った候補をクリックして差し替えできます。`);
 }catch(e){st('⚠ '+(e.message||e))}
 busy=false;$('#go').disabled=false;
};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
